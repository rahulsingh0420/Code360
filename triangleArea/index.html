<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle Area Calculator</title>
    <style>
       
    </style>
</head>
<body>
    <h1>Triangle Area Calculator</h1>
    
    <form id="triangleForm">
        <label for="sideA">Side A</label>
        <input type="number" id="sideA" required>
        
        <label for="sideB">Side B</label>
        <input type="number" id="sideB" required>
        
        <label for="sideC">Side C</label>
        <input type="number" id="sideC" required>
        
        <button type="button" onclick="calculateArea()">Calculate Area</button>
    </form>

    <div id="result"></div>

    <script>
        function calculateArea() {
            const a = parseFloat(document.getElementById('sideA').value);
            const b = parseFloat(document.getElementById('sideB').value);
            const c = parseFloat(document.getElementById('sideC').value);

            if (a + b > c && a + c > b && b + c > a) {
                const s = (a + b + c) / 2;
                
                const area = Math.sqrt(s * (s - a) * (s - b) * (s - c));
                
                document.getElementById('result').style.display = 'block';
                document.getElementById('result').innerHTML = `${area.toFixed(2)}`;
            } else {
                document.getElementById('result').style.display = 'block';
                document.getElementById('result').innerHTML = "Invalid triangle sides!";
            }
        }
    </script>
</body>
</html>
